#
# launcher.cfg - voci del menu di avvio
#
# title   = titolo in alto
# timeout = secondi prima dell'avvio automatico (0 = mai)
# default = last (ultima voce usata) oppure numero della voce (1 = prima)
#
# Ogni voce:  [Nome mostrato]
#             kernel = percorso del kernel sulla SD   (piu' alternative separate da |,
#                                                      viene usato il primo file che esiste)
#             info   = testo facoltativo a destra
# kernel = reboot  -> riavvia,   kernel = halt -> ferma il Raspberry
#
title   = Raspberry Pi 3 - Retro computer
timeout = 10
default = last

[MSX  (fMSX)]
kernel = /msx/kernel-msx.img
info   = MSX1 / MSX2 / MSX2+  -  ROM, DSK, CAS

[Commodore 64  (BMC64)]
kernel = /bmc64/kernel8-32.img | /bmc64/kernel7.img
info   = BMC64

[Commodore 128  (BMC64)]
kernel = /kernel8-32.img.c128 | /kernel7.img.c128

[Commodore VIC-20  (BMC64)]
kernel = /kernel8-32.img.vic20 | /kernel7.img.vic20

[Commodore Plus/4  (BMC64)]
kernel = /kernel8-32.img.plus4 | /kernel7.img.plus4

[Commodore PET  (BMC64)]
kernel = /kernel8-32.img.pet | /kernel7.img.pet

[ZX Spectrum  (ZXMini)]
kernel = /zxmini/kernel8-32.img | /zxmini/kernel7.img
info   = 48K / 128K / +2A

[Riavvia]
kernel = reboot
